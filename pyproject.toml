[project]
name = "skills-mcp"
version = "0.1.0"
description = "Self-hosted MCP server for your own skills"
requires-python = ">=3.12"
dependencies = ["fastmcp==4.2.1", "pyyaml==6.0.3"]

[dependency-groups]
dev = ["pytest>=9,<10", "ty>=0.0.1", "ruff>=0.14"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"

[tool.uv]
package = false
